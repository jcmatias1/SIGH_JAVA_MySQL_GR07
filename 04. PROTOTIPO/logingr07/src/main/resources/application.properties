spring.application.name=logingr07
server.port=8080

# Conexion a la base de datos (XAMPP: MariaDB/MySQL en el puerto 3307)
# Si tu MySQL usa el puerto 3306, cambia 3307 por 3306.
spring.datasource.url=jdbc:mysql://localhost:3307/bd_monster_gr07?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guayaquil
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA: update crea las tablas desde las entidades y DatosInicialesConfig carga los datos base.
# Ya no es obligatorio ejecutar los scripts .sql (quedan como respaldo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.open-in-view=false

# Vistas JSP (src/main/webapp/WEB-INF/jsp)
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# RF-SEG-004: la sesion expira tras 15 minutos de inactividad
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie

# Politica de acceso del hospital (RNF-004)
sigh.seguridad.max-intentos=3
sigh.seguridad.minutos-bloqueo=15

# RF-SEG-005: recuperacion de contrasena
sigh.recuperacion.minutos-vigencia=30
# true: en el taller el enlace tambien se muestra en pantalla y en la consola de NetBeans.
# En produccion debe ser false y configurarse el correo institucional.
sigh.recuperacion.mostrar-enlace=true

# Correo (opcional). Si se deja vacio, el enlace se escribe en la consola.
# Para Gmail use una "contrasena de aplicacion", nunca la contrasena personal.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jackson.serialization.indent-output=true
